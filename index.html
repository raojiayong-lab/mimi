<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>我的课表</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --pri:#5B6CFF;--pri2:#8B5CF6;--pri-soft:#EEF0FF;
  --ok:#10B981;--warn:#F59E0B;--danger:#EF4444;
  --bg:#F5F6FA;--card:#fff;--tx:#1A1D2E;--tx2:#8A90A6;--bd:#EBEDF5;
  --sh:0 2px 12px rgba(26,29,46,.06);
  --sh2:0 6px 24px rgba(91,108,255,.14);
  --safe-b:env(safe-area-inset-bottom,0px);
}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--tx);font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased}
.wrap{max-width:560px;margin:0 auto;padding-bottom:calc(24px + var(--safe-b))}

/* 顶栏 */
.hero{background:linear-gradient(135deg,var(--pri) 0%,var(--pri2) 100%);
  color:#fff;padding:26px 20px 60px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-70px;width:220px;height:220px;
  border-radius:50%;background:rgba(255,255,255,.10)}
.hero::before{content:"";position:absolute;left:-40px;bottom:-90px;width:170px;height:170px;
  border-radius:50%;background:rgba(255,255,255,.08)}
.hero .row{display:flex;justify-content:space-between;align-items:flex-start;position:relative;z-index:2}
.hero h1{font-size:23px;font-weight:600;letter-spacing:.5px}
.hero .sub{font-size:13px;opacity:.9;margin-top:5px}
.hero .ava{width:44px;height:44px;border-radius:14px;background:rgba(255,255,255,.22);
  display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:600;
  backdrop-filter:blur(4px)}
.hero .chip{display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.20);
  padding:5px 12px;border-radius:20px;font-size:12px;margin-top:12px;position:relative;z-index:2;
  backdrop-filter:blur(4px)}

/* 上浮卡片 */
.lift{margin:-44px 14px 0;position:relative;z-index:3}

/* Tab */
.tabs{display:flex;gap:4px;background:var(--card);border-radius:16px;padding:5px;box-shadow:var(--sh)}
.tab{flex:1;text-align:center;padding:11px 0;border-radius:12px;font-size:14px;font-weight:500;
  color:var(--tx2);cursor:pointer;transition:.22s}
.tab.on{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;box-shadow:var(--sh2)}

.panel{display:none;animation:fade .28s ease}
.panel.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.card{background:var(--card);border-radius:18px;padding:18px;margin-top:14px;box-shadow:var(--sh)}
.card-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.card-hd h2{font-size:16px;font-weight:600;display:flex;align-items:center;gap:7px}
.pill{font-size:11px;padding:4px 10px;border-radius:20px;background:var(--pri-soft);color:var(--pri);font-weight:500}

/* 今日时间轴 */
.tl{position:relative;padding-left:2px}
.lesson{display:flex;gap:14px;position:relative;padding-bottom:16px}
.lesson:last-child{padding-bottom:0}
.lesson::before{content:"";position:absolute;left:29px;top:44px;bottom:-2px;width:2px;background:var(--bd)}
.lesson:last-child::before{display:none}
.ltime{flex:0 0 60px;text-align:center}
.ltime .sec{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;
  border-radius:12px;padding:8px 0;font-size:13px;font-weight:600;line-height:1.25;box-shadow:var(--sh2)}
.ltime .sec b{display:block;font-size:15px}
.ltime .tm{font-size:11px;color:var(--tx2);margin-top:6px;line-height:1.3}
.lbody{flex:1;background:#FAFBFF;border:1px solid var(--bd);border-radius:14px;padding:13px 15px;
  transition:.2s}
.lbody:active{transform:scale(.985)}
.lname{font-size:16px;font-weight:600;line-height:1.35;margin-bottom:9px}
.ltags{display:flex;flex-wrap:wrap;gap:6px}
.tg{font-size:11px;padding:3px 9px;border-radius:7px;background:#fff;border:1px solid var(--bd);color:var(--tx2);
  display:inline-flex;align-items:center;gap:3px;max-width:100%}
.tg.loc{color:var(--pri);border-color:#DDE1FF;background:#F7F8FF}
.tg.tch{color:#0F766E;border-color:#C7EEE6;background:#F0FBF8}

/* 空状态 */
.empty{text-align:center;padding:42px 0;color:var(--tx2)}
.empty .ic{font-size:44px;margin-bottom:10px}
.empty p{font-size:14px}

/* 周课表网格 */
.gw{display:grid;grid-template-columns:38px repeat(7,1fr);gap:4px;overflow-x:auto}
.gh{font-size:11px;text-align:center;padding:7px 0;border-radius:8px;font-weight:600;color:var(--tx2);background:#F7F8FC}
.gh.today{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff}
.gl{display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--tx2);
  background:#F7F8FC;border-radius:8px;writing-mode:vertical-rl;letter-spacing:1px;padding:4px 0}
.gc{background:#F7F8FC;border-radius:8px;min-height:54px;position:relative}
.gc.busy{background:linear-gradient(150deg,#EEF0FF,#F6F0FF);border:1px solid #E3E6FF;
  padding:5px 3px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2px;cursor:pointer;transition:.18s;overflow:hidden}
.gc.busy:active{transform:scale(.94)}
.gc .cn{font-size:10px;font-weight:600;color:#3F4AE0;line-height:1.25;text-align:center;
  word-break:break-all;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.gc .pl{font-size:9px;color:var(--tx2);line-height:1.2;text-align:center;word-break:break-all;
  display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.gc.now{box-shadow:0 0 0 2px var(--pri),var(--sh2)}

/* 设置 */
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;color:var(--tx2);margin-bottom:6px}
.field input,.field select{width:100%;padding:12px 14px;border:1px solid var(--bd);border-radius:12px;
  font-size:15px;background:#FAFBFF;outline:none;transition:.2s;font-family:inherit}
.field input:focus{border-color:var(--pri);background:#fff;box-shadow:0 0 0 3px rgba(91,108,255,.10)}
.btn{border:none;border-radius:13px;padding:13px;font-size:15px;font-weight:500;cursor:pointer;
  width:100%;transition:.2s;font-family:inherit}
.btn.pri{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;box-shadow:var(--sh2)}
.btn.pri:active{transform:scale(.97)}
.btn.gh2{background:#fff;border:1px solid var(--bd);color:var(--tx)}
.btn.gh2:active{background:#F7F8FC}
.btn.dgr{background:#FEF2F2;color:var(--danger);margin-top:10px}

.tip{font-size:12px;color:var(--tx2);line-height:1.65;margin-top:10px;
  background:#F7F8FC;padding:11px 13px;border-radius:11px}

/* 登录 */
.mask{position:fixed;inset:0;background:rgba(26,29,46,.5);display:flex;align-items:center;
  justify-content:center;padding:24px;z-index:99;backdrop-filter:blur(3px)}
.mask.hide{display:none}
.lbox{background:#fff;border-radius:22px;padding:26px 22px;width:100%;max-width:360px;
  box-shadow:0 20px 50px rgba(0,0,0,.2);animation:pop .3s cubic-bezier(.34,1.4,.64,1)}
@keyframes pop{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
.lbox h3{font-size:19px;font-weight:600;margin-bottom:5px}
.lbox .d{font-size:13px;color:var(--tx2);margin-bottom:20px;line-height:1.6}

/* 状态条 */
.bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(26px + var(--safe-b));
  background:rgba(26,29,46,.92);color:#fff;padding:11px 20px;border-radius:22px;font-size:13px;
  z-index:120;opacity:0;pointer-events:none;transition:.25s;max-width:88%;text-align:center}
.bar.show{opacity:1}
.bar.err{background:rgba(220,38,38,.94)}

/* 加载 */
.ld{text-align:center;padding:36px 0;color:var(--tx2);font-size:14px}
.spin{display:inline-block;width:22px;height:22px;border:2.5px solid var(--bd);
  border-top-color:var(--pri);border-radius:50%;animation:sp .7s linear infinite;margin-bottom:10px}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div class="wrap">
  <div class="hero">
    <div class="row">
      <div>
        <h1 id="hiName">我的课表</h1>
        <div class="sub" id="hiSub">正在加载…</div>
      </div>
      <div class="ava" id="ava">…</div>
    </div>
    <div class="chip" id="hiChip">📅 --</div>
  </div>

  <div class="lift">
    <div class="tabs">
      <div class="tab on" data-t="today">今日</div>
      <div class="tab" data-t="week">本周</div>
      <div class="tab" data-t="set">推送</div>
    </div>

    <div class="panel on" id="p-today">
      <div class="card">
        <div class="card-hd">
          <h2>📅 今日课程</h2>
          <span class="pill" id="todayPill">--</span>
        </div>
        <div id="todayBox"><div class="ld"><div class="spin"></div><div>加载中…</div></div></div>
      </div>
    </div>

    <div class="panel" id="p-week">
      <div class="card">
        <div class="card-hd">
          <h2>🗓️ 本周课表</h2>
          <span class="pill" id="weekPill">第 ? 周</span>
        </div>
        <div id="weekBox"><div class="ld"><div class="spin"></div><div>加载中…</div></div></div>
      </div>
    </div>

    <div class="panel" id="p-set">
      <div class="card">
        <div class="card-hd"><h2>🔔 钉钉推送</h2></div>
        <div class="tip" id="pushTip">
          每天 21:00 会自动把<b>次日课表</b>推送到钉钉群。
        </div>
        <div class="field" style="margin-top:14px">
          <label>群机器人 Webhook（可选，仅存本机浏览器）</label>
          <input type="text" id="whUrl" placeholder="https://oapi.dingtalk.com/robot/send?access_token=">
        </div>
        <button class="btn pri" onclick="saveWh()">保存 Webhook</button>
        <div class="tip" style="margin-top:12px">
          ⚠️ 钉钉接口不支持网页直接调用，所以自动推送由定时任务完成，网页这里只保存配置。
        </div>
      </div>

      <div class="card">
        <div class="card-hd"><h2>👤 账号</h2></div>
        <div class="field">
          <label>学号</label>
          <input type="text" id="acc" placeholder="学号">
        </div>
        <div class="field">
          <label>教务密码</label>
          <input type="password" id="pwd" placeholder="密码（只存本机浏览器）">
        </div>
        <button class="btn pri" onclick="saveAcc()">保存并重新登录</button>
        <button class="btn dgr" onclick="logout()">退出登录</button>
        <div class="tip" style="margin-top:12px">
          账号密码保存在这台设备的浏览器里，下次打开自动登录，不需要再输。
        </div>
      </div>
    </div>
  </div>
</div>

<div class="mask hide" id="mask">
  <div class="lbox">
    <h3>登录教务系统</h3>
    <div class="d">首次使用需要登录一次，之后打开就自动登录了。</div>
    <div class="field">
      <label>学号</label>
      <input type="text" id="lUser" placeholder="例如 202517010060" autocomplete="username">
    </div>
    <div class="field">
      <label>密码</label>
      <input type="password" id="lPwd" placeholder="教务系统密码" autocomplete="current-password">
    </div>
    <button class="btn pri" id="lBtn" onclick="doLogin()">登录</button>
  </div>
</div>

<div class="bar" id="bar"></div>

<script>
const BASE = "https://jwapp.gypec.edu.cn/jwmobile";
const K = {t:'cb_token', u:'cb_user', p:'cb_pwd', w:'cb_webhook'};
const WD = ['','周一','周二','周三','周四','周五','周六','周日'];
let ST = {token:localStorage.getItem(K.t)||'', user:null, week:null, today:null};

const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];

function toast(m, err){
  const b = $('#bar'); b.textContent = m;
  b.className = 'bar show' + (err ? ' err' : '');
  clearTimeout(b._t); b._t = setTimeout(()=>b.className='bar', 2600);
}
function strip(s){ return s ? s.replace(/<[^>]+>/g,'').replace(/\s+/g,' ').trim() : ''; }
function fmt(d){ const x=new Date(d); return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`; }

async function api(path, opt={}){
  opt.headers = Object.assign({
    'Accept':'application/json, text/plain, */*',
    'Content-Type':'application/json'
  }, opt.headers||{});
  if(ST.token) opt.headers['Authorization'] = ST.token;
  let r = await fetch(BASE+path, opt);
  // token 过期 → 用保存的账号重登一次
  if(r.status===401 || (r.ok && (await r.clone().json()).code===401)){
    if(await relogin()){ opt.headers['Authorization']=ST.token; r=await fetch(BASE+path,opt); }
  }
  if(!r.ok) throw new Error('网络错误 '+r.status);
  return r.json();
}

async function relogin(){
  const u=localStorage.getItem(K.u), p=localStorage.getItem(K.p);
  if(!u||!p) return false;
  try{ await login(u,p); return true; }catch(e){ return false; }
}

async function login(user, pwd){
  const kr = await fetch(BASE+'/auth/getPublicKey',{headers:{'Accept':'application/json'}});
  const kd = (await kr.json()).data;
  const enc = new JSEncrypt();
  enc.setPublicKey(kd.publicKey);
  const ep = enc.encrypt(pwd);
  if(!ep) throw new Error('密码加密失败');
  const r = await fetch(BASE+'/auth/login/mobile',{
    method:'POST',
    headers:{'Content-Type':'application/json','Accept':'application/json'},
    body:JSON.stringify({loginName:user, loginPassword:ep, openId:'', keyId:kd.keyId})
  });
  const j = await r.json();
  if(j.code!==200) throw new Error(j.msg||'登录失败');
  ST.token = j.data.token;
  localStorage.setItem(K.t, ST.token);
  localStorage.setItem(K.u, user);
  localStorage.setItem(K.p, pwd);
  return j.data;
}

/* 解析课程 */
function parse(item){
  const cd = item.cellDetail || [];
  let name = strip(cd[0]?.text || '') || item.courseName || '';
  let type = '';
  const m = name.match(/\[(.*?)\]/);
  if(m){ type = m[1]; name = name.replace(/\[.*?\]/,'').trim(); }
  let teacher='', place='';
  const all = [...cd.map(c=>c.text||''), ...(item.titleDetail||[])].join(' ');
  const t = all.match(/data-kblx="02"[^>]*>([^<]+)/);
  const p = all.match(/data-kblx="01"[^>]*>([^<]+)/);
  if(t) teacher = t[1].trim();
  if(p) place = p[1].trim();
  if(!teacher && item.weeksAndTeachers){
    const mm = item.weeksAndTeachers.match(/\/(.+?)\[/);
    if(mm) teacher = mm[1];
  }
  if(!place && item.placeName) place = item.placeName;
  return {
    name, type, teacher, place,
    b: item.startSession ?? item.beginSection,
    e: item.endSession ?? item.endSection,
    bt: item.startTime || item.beginTime || '',
    et: item.endTime || '',
    day: parseInt(item.todayWeekDay || item.dayOfWeek || 0)
  };
}

/* 今日 */
async function loadToday(){
  const box = $('#todayBox');
  try{
    const j = await api('/biz/v410/schedule/listStudentTodayLesson');
    const list = (j.data?.data || j.data || []).map(parse).sort((a,b)=>(a.b||99)-(b.b||99));
    const now = new Date();
    $('#todayPill').textContent = `${fmt(now)} ${WD[now.getDay()]}`;
    if(!list.length){
      box.innerHTML = `<div class="empty"><div class="ic">🎉</div><p>今天没有课，好好休息</p></div>`;
      return;
    }
    box.innerHTML = '<div class="tl">' + list.map(c=>{
      const sec = c.b===c.e ? `第${c.b}节` : `第${c.b}<b>-${c.e}</b>节`;
      const tm = c.bt ? `${c.bt}${c.et?'<br>'+c.et:''}` : '';
      return `<div class="lesson">
        <div class="ltime"><div class="sec">${sec}</div>${tm?`<div class="tm">${tm}</div>`:''}</div>
        <div class="lbody">
          <div class="lname">${c.name}</div>
          <div class="ltags">
            ${c.type?`<span class="tg">${c.type}</span>`:''}
            ${c.teacher?`<span class="tg tch">👤 ${c.teacher}</span>`:''}
            ${c.place?`<span class="tg loc">📍 ${c.place}</span>`:''}
          </div>
        </div>
      </div>`;
    }).join('') + '</div>';
  }catch(e){ box.innerHTML = `<div class="empty"><div class="ic">⚠️</div><p>${e.message}</p></div>`; }
}

/* 本周 */
async function loadWeek(){
  const box = $('#weekBox');
  try{
    const tj = await api('/biz/v410/schedule/termList');
    const term = (tj.data||[]).find(x=>x.currentFlag) || tj.data?.[0];
    const wj = await api(`/biz/v410/schedule/getTermWeeks?termCode=${term.termCode}`);
    const wk = (wj.data||[]).find(x=>x.curWeek) || wj.data?.[0];
    const sj = await api('/biz/v410/schedule/getMyScheduleDetail',{
      method:'POST',
      body:JSON.stringify({termCode:term.termCode, serialNumber:wk.serialNumber})
    });
    const d = sj.data || {};
    const list = (d.arrangedList||[]).map(parse);
    $('#weekPill').textContent = `第 ${wk.serialNumber} 周`;

    const today = new Date().getDay() || 7;
    let h = '<div class="gw">';
    h += '<div class="gh"></div>';
    for(let i=1;i<=7;i++) h += `<div class="gh${i===today?' today':''}">${WD[i].slice(1)}</div>`;
    for(let s=1;s<=8;s++){
      h += `<div class="gl">${s}</div>`;
      for(let i=1;i<=7;i++){
        const cs = list.filter(c=>c.b<=s && c.e>=s && c.day===i);
        if(cs.length){
          const c = cs[0];
          h += `<div class="gc busy${i===today?' now':''}" title="${c.name} ${c.teacher||''} ${c.place||''}">
            <div class="cn">${c.name}</div>${c.place?`<div class="pl">${c.place}</div>`:''}
          </div>`;
        } else h += '<div class="gc"></div>';
      }
    }
    box.innerHTML = h + '</div>';
  }catch(e){ box.innerHTML = `<div class="empty"><div class="ic">⚠️</div><p>${e.message}</p></div>`; }
}

/* 头部信息 */
async function loadMe(){
  try{
    const j = await api('/biz/user/info');
    const u = j.data || j;
    ST.user = u;
    const name = u.xm || '同学';
    $('#hiName').textContent = name;
    $('#ava').textContent = name.slice(-2);
    $('#hiSub').textContent = [u.className, u.zymc].filter(Boolean).join(' · ');
    const n = new Date();
    $('#hiChip').textContent = `📅 ${fmt(n)} ${WD[n.getDay()]}`;
  }catch(e){ console.warn(e); }
}

/* 首次登录 */
async function doLogin(){
  const u = $('#lUser').value.trim(), p = $('#lPwd').value.trim();
  if(!u||!p) return toast('请填写学号和密码', true);
  const btn = $('#lBtn'); btn.disabled = true; btn.textContent = '登录中…';
  try{
    await login(u,p);
    $('#mask').classList.add('hide');
    await boot();
    toast('登录成功');
  }catch(e){
    toast(e.message||'登录失败', true);
    btn.disabled = false; btn.textContent = '登录';
  }
}

async function boot(){
  $('#lUser').value = localStorage.getItem(K.u)||'';
  $('#lPwd').value = localStorage.getItem(K.p)||'';
  $('#acc').value = localStorage.getItem(K.u)||'';
  $('#pwd').value = localStorage.getItem(K.p)||'';
  $('#whUrl').value = localStorage.getItem(K.w)||'';
  await loadMe(); loadToday(); loadWeek();
}

function saveAcc(){
  localStorage.setItem(K.u, $('#acc').value.trim());
  localStorage.setItem(K.p, $('#pwd').value.trim());
  logout(true);
}
function saveWh(){
  localStorage.setItem(K.w, $('#whUrl').value.trim());
  toast('已保存到本机浏览器');
}
function logout(keep){
  if(!keep) localStorage.removeItem(K.t);
  else { localStorage.removeItem(K.t); relogin().then(()=>boot()); return; }
  $('#mask').classList.remove('hide');
  $('#lBtn').disabled=false; $('#lBtn').textContent='登录';
}

/* Tab */
$$('.tab').forEach(t=>t.onclick=()=>{
  $$('.tab').forEach(x=>x.classList.remove('on')); t.classList.add('on');
  $$('.panel').forEach(p=>p.classList.remove('on'));
  $('#p-'+t.dataset.t).classList.add('on');
});

/* 启动 */
(async function(){
  if(!ST.token){
    const u = localStorage.getItem(K.u), p = localStorage.getItem(K.p);
    if(u && p){
      try{ await login(u,p); }catch(e){}
    }
  }
  if(ST.token){ $('#mask').classList.add('hide'); boot(); }
  else $('#mask').classList.remove('hide');
})();
</script>
</body>
</html>
